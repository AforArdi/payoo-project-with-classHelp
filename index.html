<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- daisy & tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font awesome cdn -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

     <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <title>Payoo | Login</title>
    <style>
        *{
            font-family: "Outfit", sans-serif;
        }
    </style>
</head>
<body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <!-- login page logo-->
    <div class="w-[220px] pt-32 mx-auto">
        <img src="./assets/Logo-full.png" alt="">
    </div>

    <!-- credentials -->
    <div class="card pt-12 mx-auto">
        <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow mx-auto rounded-2xl">
            <div class="card-body">
                <fieldset class="fieldset">
                    <label class="label font-bold text-black text-[16px]">Mobile Number</label>
                    <input id="input-email" type="text" class="input rounded-full bg-base-200" minlength="11" maxlength="11" placeholder="Enter your number" />
                    <br>
                    <label class="label font-bold text-black text-[16px]">4 Digit Pin</label>
                    <input id="input-pass" type="password" class="input rounded-full bg-base-200" placeholder="Enter 4 Digit Pin" />
                    <button id="btn-login" class="btn btn-primary mt-4 rounded-full">Login</button>
                </fieldset>
            </div>
        </div>
    </div>

    <!-- all js file angta -->
     <script src="./scripts/login.js"></script>
</body>
</html>
