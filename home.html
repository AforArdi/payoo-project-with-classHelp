<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- daisy & tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font awesome cdn -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

     <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- favicon -->
    <link rel="icon" href="./assets/logo.png" type="image/png">
    <title>Payoo | Home</title>
    <style>
        *{
            font-family: "Outfit", sans-serif;
        }
    </style>
</head>
<body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <header class="border-b-2 border-gray-200 sticky top-0 bg-base-200 z-10">
        <section class="w-11/12 mx-auto py-3 flex justify-between items-center">
            <div class="left flex gap-2">
                <!-- logo -->
                <div class="w-[60px]">
                    <img src="./assets/logo.png" alt="">
                </div>
                <!-- balance info -->
                 <div>
                    <h2 class="text-2xl font-bold">$ <span id="balance">45000</span></h2>
                    <p class="text-neutral/50">Available Balance</p>
                 </div>
            </div>

            <div class="right btn btn-soft">
                <a href="/index.html"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
            </div>
        </section>
    </header>

    <!-- welcome message -->
     <section class="w-11/12 mx-auto space-y-4">
        <h2 class="text-3xl font-bold pt-8">Welcome to Pay<span class="text-primary">oo</span></h2>
        <p class="text-neutral/50">Enjoy easy and convenient financial services with us. Cashout charge is low and</p>

        <!-- featured buttons -->
         <div class="grid grid-cols-3 gap-4">

            <button onclick="showOnly('add-money')" class="btn btn-primary btn-soft flex-col h-full py-3">
                <img src="./assets/opt-1.png" alt="">
                <p>Add Money</p>
            </button>
            <button onclick="showOnly('cashout')" class="btn btn-primary btn-soft flex-col h-full py-3">
                <img src="./assets/opt-2.png" alt="">
                <p>Cashout</p>
            </button>
            <button onclick="showOnly('send-money')" class="btn btn-primary btn-soft flex-col h-full py-3">
                <img src="./assets/opt-3.png" alt="">
                <p>Transfer Money</p>
            </button>
            <button onclick="showOnly('bonus')" class="btn btn-primary btn-soft flex-col h-full py-3">
                <img src="./assets/opt-4.png" alt="">
                <p>Get Bonus</p>
            </button>
            <button class="btn btn-primary btn-soft flex-col h-full py-3">
                <img src="./assets/opt-5.png" alt="">
                <p>Pay Bill</p>
            </button>
            <button onclick="showOnly('history')" class="btn btn-primary btn-soft flex-col h-full py-3">
                <img src="./assets/opt-6.png" alt="">
                <p>Transactions</p>
            </button>
            </div>
     </section>


     <!-- add money -->
      <section id="add-money" class="w-11/12 mx-auto py-6">
        <h2 class="text-xl font-bold mb-3">Add Money</h2>
        <div class="card bg-base-100 w-full shadow rounded-2xl">
            <div class="card-body">
                <fieldset class="fieldset">
                    <label class="label font-bold text-black text-[16px]">Select A Bank</label>
                    <select id="add-money-bank" class="select bg-base-200 rounded-full w-full">
                        <option disabled selected>Select Bank</option>
                        <option value="IBBL">IBBL</option>
                        <option value="DBBL">DBBL</option>
                        <option value="CITY">City Bank</option>
                    </select>
                    <br>
                    <label class="label font-bold text-black text-[16px]">Bank Account Number</label>
                    <input id="add-money-number" type="text" class="input w-full rounded-full bg-base-200" minlength="11" maxlength="11" placeholder="Enter 11 digit account number" />
                    <br>
                    <label class="label font-bold text-black text-[16px]">Amount to Add</label>
                    <input id="add-money-amount" type="text" class="input w-full rounded-full bg-base-200" minlength="11" maxlength="11" placeholder="Add Amount to withdraw" />
                    <br>
                    <label class="label font-bold text-black text-[16px]">Pin Number</label>
                    <input id="add-money-pass" type="password" class="input w-full rounded-full bg-base-200" placeholder="Enter 4 digit pin number" />
                    <button id="btn-add-money" class="btn btn-primary mt-4 rounded-full">Add Money</button>
                </fieldset>
            </div>
        </div>
      </section>

     <!-- cashout -->
      <section id="cashout" class="w-11/12 mx-auto py-6 hidden">
        <h2 class="text-xl font-bold mb-3">Cashout</h2>
        <div class="card bg-base-100 w-full shadow rounded-2xl">
            <div class="card-body">
                <fieldset class="fieldset">
                    <label class="label font-bold text-black text-[16px]">Agent Number</label>
                    <input id="input-cashout-number" type="text" class="input w-full rounded-full bg-base-200" minlength="11" maxlength="11" placeholder="Enter 11 digit number" />
                    <br>
                    <label class="label font-bold text-black text-[16px]">Amount</label>
                    <input id="input-cashout-amount" type="text" class="input w-full rounded-full bg-base-200" minlength="11" maxlength="11" placeholder="Enter amount to withdraw" />
                    <br>
                    <label class="label font-bold text-black text-[16px]">Pin Number</label>
                    <input id="input-pass" type="password" class="input w-full rounded-full bg-base-200" placeholder="Enter 4 digit pin number" />
                    <button id="btn-withdraw" class="btn btn-primary mt-4 rounded-full">Withdraw Money</button>
                </fieldset>
            </div>
        </div>
      </section>

    <!-- send money -->
     <section id="send-money" class="w-11/12 mx-auto py-6 hidden">
        <h2 class="text-xl font-bold mb-3">Transfer Money</h2>
        <div class="card bg-base-100 w-full shadow rounded-2xl">
            <div class="card-body">
                <fieldset class="fieldset">
                    <label class="label font-bold text-black text-[16px]">User Account Number</label>
                    <input id="send-money-number" type="text" class="input w-full rounded-full bg-base-200" minlength="11" maxlength="11" placeholder="Enter 11 digit number" />
                    <br>
                    <label class="label font-bold text-black text-[16px]">Amount</label>
                    <input id="send-money-amount" type="text" class="input w-full rounded-full bg-base-200" minlength="11" maxlength="11" placeholder="Enter amount to transfer" />
                    <br>
                    <label class="label font-bold text-black text-[16px]">Pin Number</label>
                    <input id="send-money-pass" type="password" class="input w-full rounded-full bg-base-200" placeholder="Enter 4 digit pin number" />
                    <button id="btn-send-money" class="btn btn-primary mt-4 rounded-full">Send Now</button>
                </fieldset>
            </div>
        </div>
     </section>

    <!-- get bonus -->
     <section id="bonus" class="w-11/12 mx-auto py-6 hidden">
        <h2 class="text-xl font-bold mb-3">Get Bonus</h2>
        <div class="card bg-base-100 w-full shadow rounded-2xl">
            <div class="card-body">
                <fieldset class="fieldset">
                    <label class="label font-bold text-black text-[16px]">Enter Bonus Coupon</label>
                    <input id="coupon-code" type="text" class="input w-full rounded-full bg-base-200" placeholder="Enter your coupon" />
                    <button id="btn-get-bonus" class="btn btn-primary mt-4 rounded-full">Get Bonus</button>
                </fieldset>
            </div>
        </div>
     </section>

    <!-- Transaction History -->
    <section id="history" class="w-11/12 mx-auto py-6 hidden">
        <h2 class="text-xl font-bold mb-3">Transactions</h2>
        <div id="history-container" class="flex flex-col gap-2">
            <!-- <div class="bg-base-100 p-4"></div> -->
        </div>
    </section>

     <!-- all js -->
      <script src="./scripts/machine.js"></script>
      <script src="./scripts/addMoney.js"></script>
      <script src="./scripts/sendMoney.js"></script>
      <script src="./scripts/bonus.js"></script>
      <script src="./scripts/cashout.js"></script>
</body>
</html>
